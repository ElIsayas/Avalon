name: avalon
description: Plataforma de gestión psicológica Avalon
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.4

  # Estado
  flutter_riverpod: ^2.5.1

  # UI
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.10+1
  iconsax: ^0.0.8
  device_preview: ^1.2.0

  # Utilidades
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^17.2.4
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/avalon_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F9FA"
  image: assets/images/avalon_logo.png
  android_12:
    color: "#F5F9FA"
    image: assets/icons/avalon_icon.png
