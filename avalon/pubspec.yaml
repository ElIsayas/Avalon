name: avalon
description: Plataforma de gestión psicológica Avalon
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.4

  # Estado
  flutter_riverpod: ^2.5.1

  # UI
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.10+1
  iconsax: ^0.0.8

  # Utilidades
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
